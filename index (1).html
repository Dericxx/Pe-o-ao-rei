<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peão ao Rei · Aprenda xadrez</title>
  <meta name="description" content="Aprenda xadrez do zero: lições interativas, desafios de xeque-mate e partidas contra o computador.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f3ecdf;
  --paper: #fffaf0;
  --ink: #2b2118;
  --muted: #7a6a58;
  --line: #e2d6c0;
  --light: #efe3c8;
  --dark: #6f8f72;
  --accent: #b8452b;
  --accent-ink: #fff;
  --ok: #2f7d4f;
  --ok-bg: #e3f2e6;
  --bad: #a63a22;
  --bad-bg: #fbe5df;
  --info-bg: #ece6d6;
  --hint-bg: #e1ecf8;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.55;
  background-image: radial-gradient(circle at 20% -10%, rgba(111,143,114,.18), transparent 45%),
                    radial-gradient(circle at 100% 0%, rgba(184,69,43,.10), transparent 40%);
  background-repeat: no-repeat;
  min-height: 100vh;
}

/* ---------- cabeçalho ---------- */
.top {
  max-width: 1120px;
  margin: 0 auto;
  padding: 1.1rem 1.25rem .4rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: .75rem; margin-right: auto; }
.brand-mark {
  width: 2.6rem; height: 2.6rem; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--dark); color: #fffdf7; font-size: 1.7rem;
  box-shadow: 0 2px 0 rgba(0,0,0,.18);
}
.brand h1 { margin: 0; font: 700 1.5rem/1.1 var(--serif); letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: .85rem; }

.tabs { display: flex; gap: .35rem; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: .25rem; }
.tab {
  border: 0; background: transparent; color: var(--ink);
  font: 600 .92rem var(--sans); padding: .5rem 1.05rem; border-radius: 999px; cursor: pointer;
}
.tab:hover { background: var(--info-bg); }
.tab[aria-current="page"] { background: var(--ink); color: #fffaf0; }

.badge { margin: 0; font-size: .82rem; color: var(--muted); }

.mute {
  border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
  width: 2.4rem; height: 2.4rem; font-size: 1.1rem; cursor: pointer; line-height: 1;
}
.mute:hover { background: var(--info-bg); }

/* ---------- layout ---------- */
.layout {
  max-width: 1120px;
  margin: 0 auto;
  padding: 1rem 1.25rem 2rem;
  display: grid;
  grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
  gap: 2rem;
  align-items: start;
}
.board-col { position: sticky; top: 1rem; }
.caption { text-align: center; margin: .75rem 0 0; font-weight: 600; color: var(--muted); min-height: 1.5em; }

@media (max-width: 880px) {
  .layout { grid-template-columns: 1fr; gap: 1rem; }
  .board-col { position: static; max-width: 560px; margin: 0 auto; width: 100%; }
}

/* ---------- tabuleiro ---------- */
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  aspect-ratio: 1;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 0 6px #3a2d22, 0 14px 30px rgba(43,33,24,.28);
  container-type: inline-size;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.sq.light { background: var(--light); }
.sq.dark  { background: var(--dark); }
.sq::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: rgba(255, 214, 10, .30); }
.sq.selected::before { background: rgba(255, 224, 70, .65); }
.sq.check::before { background: radial-gradient(circle, rgba(214,40,40,.95) 0%, rgba(214,40,40,.55) 45%, rgba(214,40,40,0) 75%); }
.sq.hint::before { background: rgba(60, 140, 255, .50); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.sq.dot::after {
  content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%;
  background: rgba(30, 24, 18, .28); pointer-events: none; z-index: 3;
}
.sq.cap::after {
  content: ""; position: absolute; inset: 4%; border-radius: 50%;
  border: .9cqw solid rgba(30, 24, 18, .30); pointer-events: none; z-index: 3;
}

.pc {
  position: relative; z-index: 2;
  font-size: 10.6cqw; line-height: 1;
  font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", "DejaVu Sans", sans-serif;
  pointer-events: none;
}
.pc.w { color: #fffdf6; -webkit-text-stroke: 1.3px #2b2118; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.pc.b { color: #221a14; -webkit-text-stroke: .6px #000; text-shadow: 0 1px 1px rgba(255,255,255,.25); }

.coord {
  position: absolute; z-index: 1; font: 600 clamp(9px, 1.9cqw, 13px) var(--sans); pointer-events: none;
}
.coord.rank { top: 3px; left: 4px; }
.coord.file { bottom: 2px; right: 4px; }
.sq.light .coord { color: var(--dark); }
.sq.dark  .coord { color: var(--light); }

/* ---------- painel ---------- */
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1.5rem 1.6rem 1.6rem;
  box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 24px rgba(43,33,24,.07);
}
.eyebrow { margin: 0 0 .25rem; font-size: .75rem; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.panel h2 { margin: 0 0 .75rem; font: 700 1.75rem/1.15 var(--serif); letter-spacing: -.01em; }
.panel h3 { font: 700 1.05rem var(--serif); margin: 1.25rem 0 .4rem; }
.prose p, .prose li { margin: 0 0 .7rem; }
.prose ol { padding-left: 1.2rem; margin: 0 0 .7rem; }
.prose strong { color: #1d140c; }

.task {
  margin-top: 1.2rem;
  border: 2px solid var(--ink);
  border-radius: 14px;
  padding: 1rem 1.1rem 1.1rem;
  background: #fff;
}
.task-prompt { margin: 0 0 .75rem; font-weight: 600; font-size: 1.05rem; }

.feedback { border-radius: 10px; padding: .6rem .85rem; margin: 0 0 .8rem; font-weight: 500; }
.feedback.ok { background: var(--ok-bg); color: var(--ok); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.hint { background: var(--hint-bg); color: #24507f; }
.feedback.info { background: var(--info-bg); color: var(--ink); }
.feedback[hidden] { display: none; }

.btns { display: flex; flex-wrap: wrap; gap: .5rem; }
button, select { font-family: var(--sans); }
.btns button, .controls select {
  border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
  font-weight: 600; font-size: .92rem; padding: .5rem .95rem; border-radius: 10px; cursor: pointer;
}
.btns button:hover { background: var(--info-bg); }
.btns button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btns button.primary:hover { filter: brightness(1.07); }
.btns button[hidden] { display: none; }
.btns button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible { outline: 3px solid rgba(60,140,255,.6); outline-offset: 2px; }

.all { margin-top: 1.2rem; border-top: 1px dashed var(--line); padding-top: .8rem; }
.all summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .7rem; }
.chip {
  border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 999px; padding: .3rem .8rem .3rem .35rem; font-size: .85rem; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: .45rem;
}
.chip span {
  display: grid; place-items: center; min-width: 1.45rem; height: 1.45rem; border-radius: 50%;
  background: var(--info-bg); font-weight: 700; font-size: .78rem;
}
.chip.cur { border-color: var(--ink); }
.chip.done span { background: var(--ok); color: #fff; }
.chip:hover { background: var(--info-bg); }

.controls { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0 0 1rem; }
.controls label { display: flex; flex-direction: column; gap: .25rem; font-size: .8rem; font-weight: 600; color: var(--muted); }

.moves { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .15rem .8rem; counter-reset: mv; max-height: 190px; overflow: auto; font-variant-numeric: tabular-nums; }
.moves li { counter-increment: mv; display: grid; grid-template-columns: 2rem 1fr 1fr; font-size: .92rem; }
.moves li::before { content: counter(mv) "."; color: var(--muted); }
.moves:empty::after { content: "Nenhum lance ainda."; color: var(--muted); font-size: .9rem; }

.foot { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem 2rem; color: var(--muted); font-size: .82rem; text-align: center; }
.foot a { color: inherit; }

@media (max-width: 520px) {
  .panel { padding: 1.1rem 1.1rem 1.3rem; }
  .panel h2 { font-size: 1.45rem; }
  .brand h1 { font-size: 1.3rem; }
}

@media (prefers-reduced-motion: reduce) {
  .sq.hint::before { animation: none; }
}

</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">♟︎</span>
      <div>
        <h1>Peão ao Rei</h1>
        <p>Aprenda xadrez passo a passo</p>
      </div>
    </div>
    <nav class="tabs" aria-label="Seções">
      <button class="tab" data-view="lessons">Lições</button>
      <button class="tab" data-view="puzzles">Desafios</button>
      <button class="tab" data-view="play">Jogar</button>
    </nav>
    <p class="badge" id="progress-badge" aria-live="polite"></p>
    <button class="mute" id="btn-sound" aria-label="Ligar ou desligar o som" title="Som">🔊</button>
  </header>

  <main class="layout">
    <section class="board-col" aria-label="Tabuleiro">
      <div id="board" role="application" aria-label="Tabuleiro de xadrez"></div>
      <p id="board-caption" class="caption" aria-live="polite"></p>
    </section>
    <aside id="panel" class="panel"></aside>
  </main>

  <footer class="foot">
    <p>Feito com <a href="https://github.com/jhlywa/chess.js">chess.js</a> · Código aberto, hospedado no GitHub Pages.</p>
  </footer>

  <!-- chess.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
/* Conteúdo didático do "Peão ao Rei".
 *
 * Cada exercício (task) tem:
 *   fen    – posição inicial
 *   prompt – o que o aluno deve fazer
 *   goal   – como validar o lance (veja goalMet abaixo)
 *   hint / hintSq – dica em texto e casa a destacar (opcional)
 *   ok / wrong    – mensagens personalizadas (opcional)
 */

const LESSONS = [
  {
    id: 'tabuleiro',
    title: 'O tabuleiro e as peças',
    body: `
      <p>O xadrez é jogado em um tabuleiro de <strong>64 casas</strong> (8 × 8), alternando claras e escuras. Cada jogador começa com 16 peças: um rei, uma dama, duas torres, dois bispos, dois cavalos e oito peões.</p>
      <p>As colunas se chamam <strong>a–h</strong> e as linhas <strong>1–8</strong>. Assim, cada casa tem um “endereço”, como <em>e4</em>. Você vê essas letras e números nos cantos do tabuleiro.</p>
      <p>No começo, a casa do canto direito de cada jogador é <strong>clara</strong>, e a dama fica na casa da própria cor. As brancas jogam primeiro; depois, um lance para cada lado.</p>
      <p><strong>Como jogar aqui:</strong> clique em uma peça e depois na casa de destino. Os pontinhos mostram para onde ela pode ir.</p>`,
    tasks: [
      {
        fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
        prompt: 'Clique em um peão e avance-o duas casas. No primeiro lance, o peão pode andar uma ou duas casas.',
        goal: { type: 'bigpawn' },
        hint: 'Escolha qualquer peão e clique na casa duas à frente dele.',
        hintSq: 'e2',
        ok: 'Isso! Na primeira vez que se move, o peão pode avançar duas casas.'
      },
      {
        fen: 'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1',
        prompt: 'Agora você joga com as pretas. Mova um dos cavalos (as peças com cabeça de cavalo).',
        goal: { type: 'piece', piece: 'n' },
        hint: 'Os cavalos ficam nas colunas b e g. Clique em um deles para ver as casas possíveis.',
        hintSq: 'g8'
      }
    ]
  },
  {
    id: 'torre',
    title: 'A torre',
    body: `
      <p>A <strong>torre</strong> anda em <strong>linha reta</strong>, na horizontal ou na vertical, quantas casas quiser. Ela não pode pular outras peças.</p>
      <p>Para capturar, a torre ocupa a casa da peça adversária, que sai do jogo. Vale aproximadamente <strong>5 pontos</strong>.</p>`,
    tasks: [
      {
        fen: '4k3/8/8/8/8/8/8/R3K3 w - - 0 1',
        prompt: 'Leve a torre até a casa a8, no outro lado do tabuleiro.',
        goal: { type: 'square', square: 'a8', piece: 'r' },
        hint: 'A torre sobe pela coluna a. O caminho está livre.',
        hintSq: 'a1'
      },
      {
        fen: '4k3/8/8/3p4/8/8/8/3RK3 w - - 0 1',
        prompt: 'Capture o peão preto com a torre.',
        goal: { type: 'capture', square: 'd5' },
        hint: 'O peão está na mesma coluna da torre.',
        hintSq: 'd1'
      }
    ]
  },
  {
    id: 'bispo',
    title: 'O bispo',
    body: `
      <p>O <strong>bispo</strong> anda nas <strong>diagonais</strong>, quantas casas quiser, sem pular peças. Por isso ele passa a partida inteira em casas da <strong>mesma cor</strong>: cada jogador tem um bispo de casas claras e outro de casas escuras.</p>
      <p>Vale cerca de <strong>3 pontos</strong>.</p>`,
    tasks: [
      {
        fen: '4k3/8/8/8/8/8/8/2B1K3 w - - 0 1',
        prompt: 'Leve o bispo até a casa h6, seguindo a diagonal.',
        goal: { type: 'square', square: 'h6', piece: 'b' },
        hint: 'Da c1, suba na diagonal: d2, e3, f4, g5…',
        hintSq: 'c1'
      },
      {
        fen: '4k3/8/8/6n1/8/8/8/2B1K3 w - - 0 1',
        prompt: 'Capture o cavalo preto com o bispo.',
        goal: { type: 'capture', square: 'g5' },
        hint: 'O cavalo está na mesma diagonal do bispo.',
        hintSq: 'c1'
      }
    ]
  },
  {
    id: 'dama',
    title: 'A dama',
    body: `
      <p>A <strong>dama</strong> é a peça mais poderosa: ela combina os movimentos da torre e do bispo. Anda em linha reta ou na diagonal, quantas casas quiser.</p>
      <p>Vale cerca de <strong>9 pontos</strong>. Cuidado para não perdê-la de graça!</p>`,
    tasks: [
      {
        fen: '4k3/8/8/8/8/8/8/3QK3 w - - 0 1',
        prompt: 'Leve a dama até a casa a4, pela diagonal.',
        goal: { type: 'square', square: 'a4', piece: 'q' },
        hint: 'Da d1 para a a4: c2, b3, a4.',
        hintSq: 'd1'
      },
      {
        fen: '4k3/8/8/7p/8/8/8/3QK3 w - - 0 1',
        prompt: 'Capture o peão em h5 com a dama.',
        goal: { type: 'capture', square: 'h5' },
        hint: 'Siga a diagonal que sai da dama em direção ao peão.',
        hintSq: 'd1'
      }
    ]
  },
  {
    id: 'cavalo',
    title: 'O cavalo',
    body: `
      <p>O <strong>cavalo</strong> se move em forma de <strong>“L”</strong>: duas casas em uma direção e uma na perpendicular. É a única peça que <strong>pula</strong> por cima das outras.</p>
      <p>Vale cerca de <strong>3 pontos</strong>. Ele é mais forte no centro do tabuleiro.</p>`,
    tasks: [
      {
        fen: '4k3/8/8/8/8/8/8/1N2K3 w - - 0 1',
        prompt: 'Leve o cavalo até a casa c3.',
        goal: { type: 'square', square: 'c3', piece: 'n' },
        hint: 'Uma casa para o lado e duas para cima: forma um L.',
        hintSq: 'b1'
      },
      {
        fen: '4k3/8/8/4p3/8/3N4/8/4K3 w - - 0 1',
        prompt: 'Capture o peão preto com o cavalo.',
        goal: { type: 'capture', square: 'e5' },
        hint: 'Duas casas para cima e uma para a direita.',
        hintSq: 'd3'
      }
    ]
  },
  {
    id: 'peao',
    title: 'O peão',
    body: `
      <p>O <strong>peão</strong> anda <strong>para a frente</strong>, uma casa por vez (duas no primeiro lance). Mas ele <strong>captura na diagonal</strong>, uma casa à frente.</p>
      <p>Se chegar à última linha, o peão é <strong>promovido</strong>: vira dama, torre, bispo ou cavalo (quase sempre uma dama!). Vale <strong>1 ponto</strong>, mas é a alma do jogo.</p>`,
    tasks: [
      {
        fen: '4k3/8/8/8/8/8/4P3/4K3 w - - 0 1',
        prompt: 'Avance o peão duas casas, até e4.',
        goal: { type: 'square', square: 'e4', piece: 'p' },
        hintSq: 'e2'
      },
      {
        fen: '4k3/8/8/3p4/4P3/8/8/4K3 w - - 0 1',
        prompt: 'Capture o peão preto com o seu peão (na diagonal!).',
        goal: { type: 'capture', square: 'd5' },
        hint: 'Peões capturam na diagonal, nunca para a frente.',
        hintSq: 'e4'
      },
      {
        fen: '8/4P1k1/8/8/8/8/8/4K3 w - - 0 1',
        prompt: 'Promova o peão: leve-o até a última linha. Aqui ele vira uma dama automaticamente.',
        goal: { type: 'promote' },
        hint: 'Falta só uma casa para a oitava linha.',
        hintSq: 'e7'
      }
    ]
  },
  {
    id: 'rei',
    title: 'O rei e o xeque',
    body: `
      <p>O <strong>rei</strong> anda <strong>uma casa</strong> em qualquer direção. É a peça mais importante: se ele for capturado, perde-se a partida. Por isso o rei nunca pode ir para uma casa atacada.</p>
      <p>Quando o rei está sob ataque, dizemos que está em <strong>xeque</strong>. Quem está em xeque precisa sair dele: <em>mover o rei</em>, <em>bloquear</em> o ataque ou <em>capturar</em> a peça que ataca.</p>`,
    tasks: [
      {
        fen: '4k3/8/8/8/8/8/8/R3K3 w - - 0 1',
        prompt: 'Dê xeque no rei preto com um lance de torre.',
        goal: { type: 'check' },
        hint: 'A torre precisa atacar o rei: coloque-a na mesma linha dele (linha 8).',
        hintSq: 'a1'
      },
      {
        fen: '4r1k1/8/8/8/8/8/8/4K3 w - - 0 1',
        prompt: 'Seu rei (brancas) está em xeque pela torre preta. Mova-o para uma casa segura.',
        goal: { type: 'any' },
        hint: 'Saia da coluna e: o rei só pode ir para casas que a torre não ataca.',
        hintSq: 'e1',
        ok: 'Perfeito! Só são permitidos lances que tiram o rei do xeque.'
      }
    ]
  },
  {
    id: 'especiais',
    title: 'Roque e en passant',
    body: `
      <p>O <strong>roque</strong> é um lance especial: o rei anda duas casas em direção a uma torre, e a torre pula para o outro lado dele. Serve para <em>proteger o rei</em> e ativar a torre.</p>
      <p>Para rocar: o rei e a torre não podem ter se movido; não pode haver peças entre eles; e o rei não pode estar em xeque nem passar por casa atacada.</p>
      <p>No <strong>en passant</strong>, se um peão adversário avança duas casas e para ao lado do seu peão, você pode capturá-lo “de passagem”, como se ele tivesse andado só uma casa. Só vale no lance seguinte!</p>`,
    tasks: [
      {
        fen: 'r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 0 1',
        prompt: 'Faça o roque: mova o rei duas casas em direção a uma torre.',
        goal: { type: 'castle' },
        hint: 'Clique no rei e escolha g1 (roque curto) ou c1 (roque longo).',
        hintSq: 'e1'
      },
      {
        fen: '4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1',
        prompt: 'O peão preto acabou de avançar de d7 para d5. Capture-o en passant!',
        goal: { type: 'enpassant' },
        hint: 'Seu peão em e5 captura na diagonal, indo para d6.',
        hintSq: 'e5'
      }
    ]
  },
  {
    id: 'mate',
    title: 'O xeque-mate',
    body: `

/** Verifica se o lance `move` (objeto verbose do chess.js, já jogado em `game`) cumpre o objetivo. */
function goalMet(goal, move, game) {
  switch (goal.type) {
    case 'any': return true;
    case 'square': return move.to === goal.square && (!goal.piece || move.piece === goal.piece);
    case 'capture': return move.to === goal.square && !!move.captured;
    case 'mate': return game.in_checkmate();
    case 'check': return game.in_check();
    case 'castle': return move.flags.includes('k') || move.flags.includes('q');
    case 'enpassant': return move.flags.includes('e');
    case 'promote': return !!move.promotion;
    case 'bigpawn': return move.flags.includes('b');
    case 'piece': return move.piece === goal.piece;
    case 'move': return goal.moves.includes(move.from + move.to);
    default: return false;
  }
}

  <script>
(function () {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);

  const TEXT_VS = '\uFE0E'; // evita que ♟ vire emoji

  /* ------------------------------------------------------------------ */
  /*  Progresso salvo no navegador                                       */
  /* ------------------------------------------------------------------ */
  const STORE = 'peao-ao-rei:v1';

  }

  /* ------------------------------------------------------------------ */
  /*  Sons (sintetizados com Web Audio: não precisa de arquivos)         */
  /* ------------------------------------------------------------------ */
  const Sound = (() => {
    const KEY = 'peao-ao-rei:mute';
    let ctx = null;
    let muted = false;
    try { muted = localStorage.getItem(KEY) === '1'; } catch (e) { /* ignora */ }

    function ac() {
      if (!ctx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        ctx = new C();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    // "toc" de madeira: ruído filtrado com decaimento rápido
    function knock(t, dur, freq, q, gain) {
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain();
      g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      src.start(t);
    }
    function tone(t, freq, dur, gain, type) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    const move = t => { knock(t, 0.09, 900, 1.2, 1.3); tone(t, 170, 0.08, 0.22); };
    const capture = t => { knock(t, 0.13, 700, 0.9, 1.9); knock(t + 0.045, 0.1, 1300, 1, 1.1); tone(t, 130, 0.12, 0.3); };

    function play(kind, delay) {
      if (muted) return;
      const c = ac();
      if (!c) return;
      const t = c.currentTime + (delay || 0);
      switch (kind) {
        case 'move': move(t); break;
        case 'capture': capture(t); break;
        case 'check': move(t); tone(t + 0.07, 880, 0.2, 0.13, 'triangle'); break;
        case 'castle': move(t); move(t + 0.13); break;
        case 'promote': move(t); [523, 659, 784, 1047].forEach((f, i) => tone(t + 0.08 + i * 0.07, f, 0.16, 0.12, 'triangle')); break;
        case 'end': capture(t); [392, 330, 262].forEach((f, i) => tone(t + 0.15 + i * 0.16, f, 0.35, 0.16, 'triangle')); break;
        case 'ok': tone(t, 660, 0.14, 0.12, 'triangle'); tone(t + 0.1, 880, 0.22, 0.12, 'triangle'); break;
        case 'bad': tone(t, 200, 0.22, 0.14, 'sawtooth'); break;
      }
    }
    function forMove(mv, g) {
      if (g.in_checkmate() || g.in_stalemate()) play('end');
      else if (g.in_check()) play('check');
      else if (mv.flags.includes('k') || mv.flags.includes('q')) play('castle');
      else if (mv.promotion) play('promote');
      else if (mv.captured) play('capture');
      else play('move');

      play, forMove,
      isMuted: () => muted,
      toggle() {

        try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) { /* ignora */ }

        return muted;
      }

  })();

  /* ------------------------------------------------------------------ */
  /*  Tabuleiro                                                          */

  class Board {
    constructor(el) {

    load(fen, orientation) {
      this.game = fen ? new Chess(fen) : new Chess();

      this.hints = [];
      this.locked = false;

        if (legal) { this.play(legal); return; }

      const p = g.get(sq);
      const mine = p && p.color === g.turn() && (!this.playerColor || p.color === this.playerColor);
      this.selected = mine ? sq : null;
      this.render();
    }

    /** Joga um lance. `silent` = não dispara onMove (usado pelo computador). */
    play(m, silent) {

      this.lastMove = [mv.from, mv.to];

      this.hints = [];

      Sound.forMove(mv, this.game);
      if (!silent && this.onMove) this.onMove(mv);
      return mv;
    }

    flip() {
      this.orientation = this.orientation === 'w' ? 'b' : 'w';

    render() {
      const g = this.game;
      const flip = this.orientation === 'b';
      const targets = new Map();
      if (this.selected) g.moves({ square: this.selected, verbose: true }).forEach(m => targets.set(m.to, m));

      let checkSq = null;
      if (g.in_check()) {
        const turn = g.turn();
        outer: for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
          const sq = FILES[f] + (r + 1);
          const p = g.get(sq);
          if (p && p.type === 'k' && p.color === turn) { checkSq = sq; break outer; }
        }

      let html = '';
      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const file = flip ? 7 - f : f;
          const rank = flip ? r : 7 - r;
          const sq = FILES[file] + (rank + 1);
          const light = (file + rank) % 2 === 1;
          const p = g.get(sq);
          let cls = 'sq ' + (light ? 'light' : 'dark');
          if (sq === this.selected) cls += ' selected';
          if (this.lastMove && this.lastMove.includes(sq)) cls += ' last';
          if (targets.has(sq)) cls += p ? ' cap' : ' dot';
          if (sq === checkSq) cls += ' check';
          if (this.hints.includes(sq)) cls += ' hint';
          html += `<div class="${cls}" data-sq="${sq}">`;
          if (f === 0) html += `<span class="coord rank">${rank + 1}</span>`;
          if (r === 7) html += `<span class="coord file">${FILES[file]}</span>`;
          if (p) html += `<span class="pc ${p.color}">${GLYPH[p.type]}${TEXT_VS}</span>`;
          html += '</div>';
        }
      }
      this.el.innerHTML = html;
      if (this.afterRender) this.afterRender();
    }

    const b = g.board();
    let s = 0;
    for (let i = 0; i < 8; i++) {
      for (let j = 0; j < 8; j++) {
        const c = b[i][j];
        if (!c) continue;
        let v = VAL[c.type];
        const x = Math.min(j, 7 - j), y = Math.min(i, 7 - i);
        if (c.type === 'n' || c.type === 'b') v += (x + y) * 4;
        if (c.type === 'p') v += (c.color === 'w' ? 6 - i : i - 1) * 4 + x * 2;
        s += c.color === 'w' ? v : -v;
      }
    }
    return g.turn() === 'w' ? s : -s;
  }

  function order(moves) {
    const score = m => (m.captured ? 10 * VAL[m.captured] - VAL[m.piece] : 0) + (m.promotion ? 800 : 0);
    return moves.sort((a, b) => score(b) - score(a));
  }

  function search(g, depth, alpha, beta) {
    const moves = g.moves({ verbose: true });
    if (!moves.length) return g.in_check() ? -99999 - depth : 0;
    if (depth === 0) return evalSide(g);
    order(moves);
    let best = -Infinity;
    for (const m of moves) {
      g.move({ from: m.from, to: m.to, promotion: m.promotion });
      const s = -search(g, depth - 1, -beta, -alpha);
      g.undo();
      if (s > best) best = s;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  function chooseMove(g, level, bestOnly) {
    const moves = g.moves({ verbose: true });
    if (!moves.length) return null;
    if (level === 1 && !bestOnly) {
      const caps = moves.filter(m => m.captured);
      return pick(caps.length && Math.random() < 0.5 ? caps : moves);
    }
    const depth = bestOnly ? 3 : level === 2 ? 2 : 3;
    order(moves);
    const scored = moves.map(m => {
      g.move({ from: m.from, to: m.to, promotion: m.promotion });
      const s = -search(g, depth - 1, -Infinity, Infinity);
      g.undo();
      return [s, m];
    });
    const top = Math.max(...scored.map(x => x[0]));
    const margin = bestOnly ? 0 : level === 2 ? 15 : 5;
    return pick(scored.filter(x => x[0] >= top - margin).map(x => x[1]));
  }

  /* ------------------------------------------------------------------ */
  /*  Jogar contra o computador                                          */
  /* ------------------------------------------------------------------ */
  const play = { color: 'w', level: 2, thinking: false };

  function renderPlay() {
    panel.innerHTML = `
      <p class="eyebrow">Treino</p>
      <h2>Jogue contra o computador</h2>
      <div class="prose"><p>Coloque em prática o que aprendeu. Travou? Peça uma <strong>dica</strong> ou desfaça o último lance.</p></div>
      <div class="controls">
        <label>Você joga de
          <select id="sel-color">
            <option value="w">Brancas</option>
            <option value="b">Pretas</option>
          </select>
        </label>
        <label>Nível
          <select id="sel-level">
            <option value="1">Iniciante</option>
            <option value="2" selected>Intermediário</option>
            <option value="3">Avançado</option>
          </select>
        </label>
      </div>
      <div class="btns" style="margin-bottom:.9rem">
        <button class="primary" id="btn-new">Nova partida</button>
        <button id="btn-undo">Desfazer</button>
        <button id="btn-tip">Dica</button>
        <button id="btn-flip">Virar tabuleiro</button>
      </div>
      <div class="feedback info" id="status"></div>
      <h3>Lances</h3>
      <ol class="moves" id="moves"></ol>`;

    $('#sel-color').value = play.color;
    $('#sel-level').value = String(play.level);
    $('#sel-color').onchange = e => { play.color = e.target.value; newGame(); };
    $('#sel-level').onchange = e => { play.level = +e.target.value; };
    $('#btn-new').onclick = newGame;
    $('#btn-flip').onclick = () => board.flip();
    $('#btn-undo').onclick = undo;
    $('#btn-tip').onclick = tip;
    newGame();
  }

  function newGame() {
    token++;
    play.thinking = false;
    board.load(null, play.color);
    board.playerColor = play.color;
    board.onMove = onPlayerMove;
    updatePlayUI();
    if (play.color === 'b') engineMove();
  }

  function gameOver() { return board.game.game_over(); }

  function onPlayerMove() {
    updatePlayUI();
    if (!gameOver()) engineMove();
  }

  function engineMove() {
    const mine = ++token;
    play.thinking = true;
    board.locked = true;
    updatePlayUI();
    setTimeout(() => {
      if (mine !== token) return;
      const m = chooseMove(board.game, play.level, false);
      if (m) board.play(m, true);
      play.thinking = false;
      board.locked = false;
      updatePlayUI();
    }, 350);
  }

  function undo() {
    if (play.thinking) return;
    const g = board.game;
    if (!g.history().length) return;
    g.undo();
    if (g.turn() !== play.color && g.history().length) g.undo();
    board.lastMove = null;
    board.selected = null;
    board.hints = [];
    board.render();
    updatePlayUI();
    if (g.turn() !== play.color && !gameOver()) engineMove();
  }

  function tip() {
    if (play.thinking || gameOver() || board.game.turn() !== play.color) return;
    const m = chooseMove(board.game, 3, true);
    if (!m) return;
    board.hints = [m.from, m.to];
    board.render();
    const st = $('#status');
    st.textContent = `Dica: que tal mover a peça de ${m.from} para ${m.to}?`;
    st.className = 'feedback hint';
  }

  function updatePlayUI() {
    const g = board.game;
    const st = $('#status');
    if (!st) return;
    let text, kind = 'info';
    if (g.in_checkmate()) {
      const winner = g.turn() === 'w' ? 'b' : 'w';
      text = `Xeque-mate! As ${winner === 'w' ? 'brancas' : 'pretas'} vencem. ` +
        (winner === play.color ? 'Parabéns! 🎉' : 'Tente de novo, use as dicas!');
      kind = winner === play.color ? 'ok' : 'bad';
    } else if (g.in_stalemate()) text = 'Empate por afogamento.';
    else if (g.insufficient_material()) text = 'Empate por material insuficiente.';
    else if (g.in_threefold_repetition()) text = 'Empate por repetição de posição.';
    else if (g.in_draw()) text = 'Empate.';
    else if (play.thinking) text = 'O computador está pensando…';
    else text = 'Sua vez.' + (g.in_check() ? ' Seu rei está em xeque!' : '');
    st.textContent = text;
    st.className = 'feedback ' + kind;

    const hist = g.history();
    let li = '';
    for (let i = 0; i < hist.length; i += 2) li += `<li><span>${hist[i]}</span><span>${hist[i + 1] || ''}</span></li>`;
    $('#moves').innerHTML = li;
    const ol = $('#moves');
    ol.scrollTop = ol.scrollHeight;
  }

  /* ------------------------------------------------------------------ */
  /*  Início                                                             */
  /* ------------------------------------------------------------------ */
  const soundBtn = $('#btn-sound');
  const syncSound = () => { soundBtn.textContent = Sound.isMuted() ? '🔇' : '🔊'; };
  soundBtn.addEventListener('click', () => { Sound.toggle(); syncSound(); });
  syncSound();

  updateBadge();
  const firstOpen = LESSONS.findIndex(l => !progress.lessons[l.id]);
  lessonIdx = firstOpen === -1 ? 0 : firstOpen;
  const firstPuzzle = PUZZLES.findIndex((_, i) => !progress.puzzles[i]);
  puzzleIdx = firstPuzzle === -1 ? 0 : firstPuzzle;
  setView('lessons');
})();

</script>
</body>
